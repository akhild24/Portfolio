services:
  # ── Frontend — Nginx serving React build + API proxy ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 128m

  # ── Backend — FastAPI / Uvicorn ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8000"
    restart: unless-stopped
    mem_limit: 256m
