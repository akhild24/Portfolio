# ═══════════════════════════════════════════════════════════════════════════════
# CI/CD — Build, push to Docker Hub, deploy to AWS EC2
# Triggers on push to main branch
# ═══════════════════════════════════════════════════════════════════════════════

name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger from GitHub UI

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/portfolio-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/portfolio-backend

jobs:
  # ── Step 1: Build & push Docker images to Docker Hub ───────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 2: SSH into EC2 and deploy ────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "═══ Pulling latest images ═══"
            docker pull ${{ env.FRONTEND_IMAGE }}:latest
            docker pull ${{ env.BACKEND_IMAGE }}:latest

            echo "═══ Stopping old containers ═══"
            cd ~/portfolio-website
            docker compose down || true

            echo "═══ Updating compose file to use Hub images ═══"
            # Create a production compose override that uses pulled images
            cat > docker-compose.prod.yml << 'COMPOSE'
            services:
              frontend:
                image: ${{ env.FRONTEND_IMAGE }}:latest
                ports:
                  - "3000:80"
                depends_on:
                  - backend
                restart: unless-stopped
                mem_limit: 128m

              backend:
                image: ${{ env.BACKEND_IMAGE }}:latest
                env_file:
                  - .env
                expose:
                  - "8000"
                restart: unless-stopped
                mem_limit: 256m
            COMPOSE

            echo "═══ Starting new containers ═══"
            docker compose -f docker-compose.prod.yml up -d

            echo "═══ Cleaning up old images ═══"
            docker image prune -f

            echo "═══ Deployment complete ═══"
            docker ps
